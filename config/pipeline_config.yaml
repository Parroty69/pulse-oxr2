model:
  device: cpu
  tier3_backend: mock
  tier3_runtime: mock
  tier3_quantization: none
  compute_dtype: fp32
  screening_dtype: fp32
  medsam_checkpoint_path: medsam_vit_b.pth
  use_mock_models: true
  release_between_tiers: true
pipeline:
  score_threshold: 0.5
  tile_size: 512
  tile_overlap: 0.2
  tile_batch_size: 4
  max_gpu_concurrency: 1
  mask_min_area_px: 64
  box_merge_iou: 0.3
  max_regions_per_label: 2
  use_lite_medsam: false
